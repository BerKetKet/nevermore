name: Lint

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck qt6-declarative-dev-tools \
            qml6-module-qtquick qml6-module-qtquick-layouts qml6-module-qtquick-controls qml6-module-qtcore

      - name: Add Qt6 tool directory to PATH
        run: echo "/usr/lib/qt6/bin" >> "$GITHUB_PATH"

      - name: Run shellcheck
        run: |
          shellcheck install.sh scripts/nevermore-run scripts/nevermore-raise

      - name: Run qmllint
        run: |
          if qmllint --help | grep -q -- '--unresolved-type'; then
            qmllint --import disable --unresolved-type disable --missing-property disable --unqualified disable contents/ui/*.qml
          else
            qmllint --import disable --type disable --property disable --unqualified disable contents/ui/*.qml
          fi
