# Nevermore Dedicated Terminal Tmux Configuration
# Invisible, passthrough multiplexer backend for Nevermore Control Center

# Disable status bar completely
set -g status off

# Disable prefix key so all keys pass through directly to zsh/editor/programs
unbind C-b
set -g prefix None

# Window size tracks the latest/active attached client (avoids miniature clamped dimensions)
setw -g window-size latest

# Large scrollback history
set -g history-limit 50000

# Zero escape time for instant vi/emacs/shell response
set -s escape-time 0

# True color support (24-bit RGB)
set -as terminal-features ",*:RGB"
set -ag terminal-overrides ",xterm-256color:Tc"

# Mouse support enabled
set -g mouse on

# Use user shell
set -g default-terminal "xterm-256color"
